[project]
name = "tuya-ble-sdk"
version = "0.1.1"
description = "Python SDK for Tuya Bluetooth Low Energy devices"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Roque", email = "rodrigogoncalvesroque@gmail.com" }]
keywords = ["tuya", "bluetooth", "ble", "sdk", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
# Runtime dependencies carry a floor and nothing else. Home Assistant pins its
# own transitive dependencies exactly, so an `==` pin — or an upper bound —
# eventually contradicts HA's pin and the consuming integration stops
# installing. Exact versions belong in the dependency groups below and in
# uv.lock, neither of which reaches the consumer.
dependencies = [
    "bleak>=3.0.0",
    "bleak-retry-connector>=4.4.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12.0",
]

[project.scripts]
tuya-ble = "tuya_ble_sdk.cli:app"

[project.urls]
Homepage = "https://github.com/roquerodrigo/tuya-ble-sdk"
Repository = "https://github.com/roquerodrigo/tuya-ble-sdk"
Issues = "https://github.com/roquerodrigo/tuya-ble-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuya_ble_sdk"]

[tool.hatch.build.targets.sdist]
exclude = ["tests"]

[dependency-groups]
dev = [
    "typer==0.27.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pre-commit==4.6.2",
]
lint = [
    "ruff==0.16.3",
    "mypy==2.3.1",
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=src/tuya_ble_sdk",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]  # ruff 0.16 formats Python blocks in Markdown; docs keep their own layout

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "D203",    # no-blank-line-before-class (incompatible with formatter)
    "D212",    # multi-line-summary-first-line (incompatible with formatter)
    "COM812",  # incompatible with formatter
    "ISC001",  # incompatible with formatter
    "CPY001",  # copyright headers are not used in this project
    "TID252",  # relative imports between same-package siblings are the house style
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"src/tuya_ble_sdk/cli.py" = [
    "FBT001",   # a boolean-positional flag is the typer idiom
    "FBT003",   # so is the boolean positional passed to typer.Option
    "PLR0913",  # a command's options are its signature
    "PLR0917",
]
"tests/**" = [
    "ARG002",   # the fake peripheral mirrors bleak's signature, unused arguments included
    "EM101",    # a literal message is fine in a throwaway test double
    "FBT001",   # so is a boolean flag mirroring bleak's own signature
    "FBT002",
    "PLC0415",  # a local import keeps a helper's dependency next to its only use
    "PT018",    # a composite assertion reads better than splitting one fact in two
    "S324",     # tests recompute the MD5 the protocol specifies
    "TRY003",   # a literal message is fine in a throwaway test double
    "S101",     # assert is normal in pytest
    "S105",     # hardcoded-password-string is fine for fake test credentials
    "S106",     # hardcoded-password-func-arg is fine for fake test credentials
    "D",        # no docstrings required in tests
    "ANN",      # no type annotations required in tests
    "ARG001",   # fixtures are used implicitly by pytest
    "SLF001",   # testing internal methods is intentional
    "PLR2004",  # magic numbers in test assertions are fine
]
